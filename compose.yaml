services:
  gatus:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    volumes:
      - ./config.yaml:/config/config.yaml:ro

  ui-development:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-builder
    ports:
      - 8081:8081
    environment:
      - NODE_ENV=development
    volumes:
      - ./web/app:/app:ro
      - /app/node_modules # Needed to prevent host mount overriding it
    command: "npm run serve"
    profiles: [dev]
    restart: unless-stopped
